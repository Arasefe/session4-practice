name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  TRIVY_VERSION: 0.75.0
  # SHA-256 of trivy_0.75.0_Linux-64bit.tar.gz, from the release's published digest
  TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: npm run build

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Trivy (pinned and verified)
        run: |
          curl -sSfLo trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum -c
          tar xzf trivy.tar.gz trivy
          sudo mv trivy /usr/local/bin/
      - name: Block known-vulnerable dependencies
        run: trivy fs --exit-code 1 --severity HIGH,CRITICAL .
